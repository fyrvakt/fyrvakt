name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search existing issues first. Discuss large API or architecture changes here before opening a pull request.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you would like to see. Mention alternatives you considered.
    validations:
      required: true
